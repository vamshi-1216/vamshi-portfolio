[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# PORT only configures the local Express dev server and is not a secret.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PORT"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
